name: Deploy to Server

on:
  push:
    branches:
      - '100ugolnik.ru'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get branch name
        id: branch_name
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Set variables
            BRANCH_NAME="${{ steps.branch_name.outputs.branch }}"
            PROJECT_DIR="/home/${{ secrets.SERVER_USER }}/projects/${BRANCH_NAME}"
            
            # Create project directory if it doesn't exist
            mkdir -p "${PROJECT_DIR}"
            
            # Navigate to project directory
            cd "${PROJECT_DIR}"
            
            # Clone if doesn't exist, otherwise just pull
            if [ ! -d ".git" ]; then
              echo "First time setup - cloning repository..."
              git clone --single-branch --branch "${BRANCH_NAME}" git@github.com:krvvko/git-NSM-upload.git .
            fi
            
            # Pull latest changes
            echo "Pulling latest changes for branch ${BRANCH_NAME}..."
            git checkout "${BRANCH_NAME}"
            git pull origin "${BRANCH_NAME}"
            
            # Install deps
            pnpm install
            
            # Delete old build
            rm -rf .next
            rm -rf node_modules/.cache
            
            # Build project
            pnpm run build
            
            # restart pm2
            pm2 startOrReload ecosystem.config.js
            pm2 save
            pm2 status
            echo "Deployment completed successfully!"