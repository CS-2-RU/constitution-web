name: Deploy to Server

on:
  push:
    branches:
      - 'constitution-next.krvvko.me'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get branch name
        id: branch_name
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: "22"
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Set variables
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"
            
            BRANCH_NAME="${{ steps.branch_name.outputs.branch }}"
            PROJECT_DIR="/root/constitution.cs2ru.online"
            
            # Navigate to project directory
            cd "${PROJECT_DIR}" || { mkdir -p "${PROJECT_DIR}" && cd "${PROJECT_DIR}"; }
            
            # Check if it's a git repo
            if [ ! -d ".git" ]; then
              echo "Not a git repository. Cleaning and cloning..."
              cd ..
              rm -rf "${PROJECT_DIR}"
              git clone --single-branch --branch "${BRANCH_NAME}" git@github.com:CS-2-RU/constitution-web.git "${PROJECT_DIR}"
              cd "${PROJECT_DIR}"
            else
              echo "Git repository exists. Pulling latest changes..."
              git fetch origin
              git checkout "${BRANCH_NAME}"
              git pull origin "${BRANCH_NAME}"
            fi
            
            # Install deps
            pnpm install
            
            # Generate Prisma Client
            echo "Generating Prisma Client..."
            pnpm prisma generate
            
            # Run migrations
            echo "Running database migrations..."
            pnpm prisma migrate dev --name init
            
            # Delete old build
            rm -rf .next
            rm -rf node_modules/.cache
            
            # Build project
            pnpm run build
            
            # Restart pm2
            pm2 startOrReload ecosystem.config.js
            pm2 save
            pm2 status
            
            echo "Deployment completed successfully!"